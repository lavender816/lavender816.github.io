template data-writer-help><div class="writer-help"><p>选中文字后点击格式按钮，或从下拉菜单插入组件。支持撤销、重做、查找替换、Markdown 高亮与实时预览。</p><p>上方「编辑区」「预览区」可以分别开关，不会清空内容。拖动中间分隔线调整两侧宽度，双击恢复均分；分隔线获得焦点时也可用左右方向键调整。手机上两区上下排列。</p><p>勾选「同步滚动」后，两侧按滚动比例联动；关闭后可分别阅读与编辑。预览使用博客原有的 Markdown 插件、组件模板、文章样式与交互脚本。</p><p>「章节大纲」可定位正文；「组件参数」可填写提示块、代码树、画廊、留声机等组件参数后插入；「发布前检查」提示缺少标题、空链接、图片说明、标题跳级、未闭合代码块和部分 Hexo 标签。检查不会联网验证地址，也不代表覆盖所有语法错误。</p><p>修改后约 0.65 秒自动保存当前草稿。顶部「草稿」可命名、新建、切换、另存当前内容，并查看每稿最多 5 个历史版本。切换前先保存；失败时不切换。移入回收站是可恢复的软删除，不会自动清空。</p><p>历史版本在内容变化满约 5 分钟后的保存、主动留版本、切换草稿和恢复版本前留存，相同内容不重复记录；每稿超过 5 个时移除最早历史。草稿名称只用于管理，不修改文章标题。恢复版本会保留被替换的当前内容。</p><p>其他标签页改稿、存储已满或权限拒绝时会明确提示，当前文字仍保留。冲突时可以在草稿面板「另存当前内容为新草稿」。原有单草稿会自动迁移，旧记录不删除；旧版页面后续更新会单独提示保留。保存需要支持 Web Locks 的新版浏览器及 HTTPS 或本地页面。</p><p>最多 30 份草稿（含回收站），每稿最多 30 万字符。无痕窗口关闭、清除浏览器数据或更换设备后，草稿可能无法恢复；请仍将成稿复制到文章文件备份。</p><p>草稿只写入当前浏览器，不发送到评论服务或博客服务器；图片、仓库卡片和音乐需要的公开资源会按内容加载。引用本机文件、目录导入等依赖 Hexo 构建的语法会保留原文并提示。</p><p>此页面没有发布、导入或导出功能。「复制 Markdown」或 Ctrl / ⌘ + S 可复制成稿。</p></div></template></main><noscript>写作室需要启用 JavaScript 才能使用。</noscript></body></html>
